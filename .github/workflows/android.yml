name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build the APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run the logic tests
        run: npm test

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Rename the artifact
        run: |
          mkdir -p out
          VERSION=$(node -p "require('./app.json').expo.version")
          cp android/app/build/outputs/apk/release/app-release.apk "out/anbar-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: anbar-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
